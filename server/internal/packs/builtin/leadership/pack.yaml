pack:
  id: leadership
  version: 1.0.0
  title: Direction & leadership team
  summary: Decisions logged as work items with a named owner, a reversibility call, a weekly briefing and an analyst that prepares options without ever choosing one.
  description: |
    Sets up the leadership team's own workspace: a **Decision** work item type,
    a "Decision owner" and a "Reversible?" property, the two statuses a decision
    actually waits in, labels for the areas a small company decides about, saved
    views for what is open and what is waiting, a board-preparation project, an
    analyst agent that writes decision briefs with alternatives and
    uncertainties, a weekly briefing autopilot, and a doctrine section that says
    how a decision is closed here.

    Works with no agent at all: the type, the properties and the views make the
    decision log usable in the first meeting. Connect the native runtime to let
    the analyst prepare briefs.

    First week: log the three decisions currently in the air as Decision items,
    name an owner for each, set "Reversible?", and close one with its rationale
    written in the item. That single closed decision is the pattern the rest
    copy.
  domain: leadership
  wave: 2
  author: Multica
  license: MIT
  tags: [leadership, decisions, board, briefing]
  works_without_agents: true
  metric:
    label: Decisions closed with a written rationale
    description: Share of Decision items closed in a month whose item contains the rationale, the alternatives rejected and what would change the call.
    hint: Type "decision", view "Decision log"; count the closed ones whose description or a comment carries the rationale.
  prerequisites:
    - kind: native_runtime
      name: Native runtime
      optional: true
      note: Lets the analyst agent prepare briefs in the browser without a CLI.
  changelog:
    - version: 1.0.0
      note: First release.

