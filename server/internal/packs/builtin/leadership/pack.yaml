business_rules:
  - title: A decision is not closed without a written rationale
    attach_point: issue_submit_review
    natural_language: An issue of type "decision" cannot be submitted for review unless its description or one of its comments states the rationale, the alternatives that were rejected, and what would change the decision.
  - title: No brief on a decision without a named owner
    attach_point: agent_run_dispatch
    natural_language: An agent run must not be dispatched on an issue of type "decision" whose "Decision owner" property is empty.

doctrine: |
  - Anything that changes a commitment, a budget or a headcount is a Decision item with a named Decision owner before the discussion starts. One owner, not a group.
  - A decision closes only when the item carries its rationale, the alternatives rejected, and what would change the call. Without that it stays open, whatever was said in the room.
  - A one-way door is never decided in one sitting: it waits at least a week and someone is asked to write the case against it.
  - Deferring is a decision too. "Deferred" names the date or the event that reopens it, or it is not deferred, it is forgotten.
  - The analyst prepares options, evidence and uncertainties. It never picks an option, never commits the company, and never contacts anyone outside the workspace.
  - What was decided reaches everyone it binds within a working day, in the item and in the weekly briefing. Reopening needs new information, not a new mood.

