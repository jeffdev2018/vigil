notes:
  - title: Leadership · How a decision is written
    content: |
      # How a decision is written here

      A closed Decision item must let someone who was not in the room
      reconstruct the call. Four paragraphs, no template ceremony:

      **Decided.** The option chosen, in one sentence, in the active voice.

      **Because.** The two or three reasons that actually moved the owner. Not
      the list of everything true about the option.

      **Rejected.** The other options and the single reason each lost. This is
      the part everyone skips and the part that is worth reading a year later.

      **Would change it.** The fact, number or event that would make us revisit
      this. If nothing would, say that — a decision with no falsifier is a
      value, not a decision.

      ## Reversibility
      - **Reversible** — decide fast, in the meeting, with one owner.
      - **Costly to undo** — one round of brief and one night.
      - **One-way door** — a week minimum, a named person writes the case
        against, and the owner answers it in writing before deciding.
    tags: [leadership, decisions]
    pinned: true

