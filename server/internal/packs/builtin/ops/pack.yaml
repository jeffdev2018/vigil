notes:
  - title: Ops · Runbook library
    content: |
      # Runbook library

      One section per recurring procedure. A runbook that is not here does not
      exist: the runner refuses to invent steps.

      Each entry: when it runs, who owns it, the steps in order with the time
      each one is due, and how you know the step worked.

      ## Nightly backup verification — every day, 07:00, ops on rota
      1. 07:00 — check last night's job finished. Proof: the job log shows an exit code of 0.
      2. 07:10 — restore one random file into the scratch area. Proof: the file opens and its checksum matches.
      3. 07:20 — record the restore time on the issue. Escalate as S2 if it is over 30 minutes.
      Stop condition: if step 2 fails, declare an incident before finishing the checklist.

      ## Month-end close — first business day, finance + ops
      1. Freeze new purchase orders. Proof: the queue is empty.
      2. Reconcile the supplier statements against invoices. Proof: every line matched or listed as an exception.
      3. Hand the exception list to finance. Proof: a comment from finance on the issue.
    tags: [ops, runbook]
    pinned: true

