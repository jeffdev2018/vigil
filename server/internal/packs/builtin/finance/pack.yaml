notes:
  - title: Finance · Approval thresholds & close checklist
    content: |
      # Approval thresholds

      Amounts are in the workspace's reporting currency, per item, gross.
      Splitting one commitment into several items to stay under a threshold is
      the threshold being broken, not respected.

      | Amount | Who signs | Evidence |
      | --- | --- | --- |
      | Under 1,000 | One approver | Invoice or receipt |
      | 1,000 to 10,000 | One approver | Invoice and the order it fulfils |
      | 10,000 to 50,000 | Two approvers, different reporting lines | Invoice and a written order |
      | Over 50,000 | Two approvers, one an owner | Signed contract or written order |

      Recurring commitments count at their annual value, not their monthly one.
      A 900-a-month subscription is a 10,800 commitment.

      An agent is not an approver at any amount.

      # Close checklist

      One item per line, an owner and a due date on each:

      1. Bank statements imported, reconciled to the ledger
      2. Supplier invoices booked; accruals for those not yet received
      3. Expense claims and card charges justified and booked
      4. Customer invoices issued; unpaid ones aged and chased
      5. Payroll booked and reconciled to the payroll report
      6. VAT or sales tax position computed, filing date checked
      7. Trial balance reviewed; variances written up, not smoothed
      8. Period locked; closing date recorded on the last task

      Target: the last task closed within five working days of the period end.
    tags: [finance, approvals, close]
    pinned: true

