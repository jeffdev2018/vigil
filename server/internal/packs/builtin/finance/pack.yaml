business_rules:
  - title: Any payment or commitment is approved by a person
    attach_point: issue_submit_review
    natural_language: An issue of type "invoice" or "expense" cannot be moved to done by an agent, and cannot be approved without a member writing the approval in the issue.
  - title: Above the threshold a second approver signs
    attach_point: issue_submit_review
    natural_language: An issue of type "invoice" or "expense" whose "Amount band" is "10,000 to 50,000" or "Over 50,000" cannot be submitted for review unless two different members have written their approval in the issue, and they must not be in the same reporting line.

doctrine: |
  - Any payment, refund or commitment is approved by a named person, in the item, before it leaves the company. An agent never approves, never sends and never schedules a payment.
  - Above 10,000 (in the workspace's reporting currency) a second approver signs, and the two approvers are not in the same reporting line. Change the number here and in the "Approval required" property if your threshold differs — but change it in both, and say who agreed.
  - No approval without evidence: the invoice, contract or written order is attached or linked in the item. Missing evidence sets the status to Awaiting document, never to approved "while we wait".
  - The reconciliation assistant states its assumptions and lists what it could not match. A match it is unsure of stays unmatched with a note; a plausible guess booked as a fact is the one error that compounds.
  - The close is a checklist, not a memory. Every close task is an item with an owner and a due date, and the close is not finished until the last one is closed.
  - Numbers quoted outside finance come from a closed period. A figure from a period still open is labelled provisional, every time, including in a hurry.

