pack:
  id: finance
  version: 1.0.0
  title: Finance
  summary: Invoices, expenses and close tasks as work items, an approval a person has to give, a second signature above a threshold, and a reconciliation assistant that writes down what it could not match.
  description: |
    Sets up a small finance function: an **Invoice**, an **Expense** and a
    **Close task** type, an "Amount band" and an "Approval required" property
    that make the threshold rule visible on every item, the two statuses money
    actually waits in, saved views for the approval queue and the month-end
    close, an approval gate no agent can pass, a reconciliation assistant that
    documents its assumptions and its unmatched items, a month-end close
    checklist autopilot, and a doctrine section with the approval thresholds.

    Works with no agent at all: the types, the amount bands and the approval
    gate give a one-person finance desk a control it can prove. Connect the
    native runtime to let the assistant reconcile.

    First week: set your own threshold in the doctrine section and in the
    "Approval required" property (the pack ships 10,000 as the second-signature
    line), then run one close through the checklist project and record how many
    working days it took. That number is the baseline.
  domain: finance
  wave: 3
  author: Multica
  license: MIT
  tags: [finance, invoices, approvals, close]
  works_without_agents: true
  metric:
    label: Close completed within N working days
    description: Working days between the end of a period and the last close task being closed. The team sets N; five is the shipped target.
    hint: Project "Month-end close", type "close_task"; measure from the period end to the last task closed.
  prerequisites:
    - kind: native_runtime
      name: Native runtime
      optional: true
      note: Lets the reconciliation assistant run in the browser without a CLI.
    - kind: integration
      name: Accounting system or bank export
      optional: true
      note: Without one, the assistant reconciles from files and figures people paste into the item.
  changelog:
    - version: 1.0.0
      note: First release.

