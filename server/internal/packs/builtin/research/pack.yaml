transition_rules:
  - from_category: in_progress
    to_category: in_review
    allowed_roles: [owner, admin, member]
    allow_actor_types: [member, agent]
    requires_approval: false
    approver_roles: []
    enabled: true
  - from_category: in_review
    to_category: done
    allowed_roles: [owner, admin, member]
    allow_actor_types: [member]
    requires_approval: true
    approver_roles: [owner, admin]
    reject_status_key: in_progress
    enabled: true

business_rules:
  - title: A synthesis with no cited source is not approved
    attach_point: issue_submit_review
    natural_language: An issue of type "question" or "synthesis" cannot be submitted for review while its "Evidence base" property is "Nothing yet", or while its synthesis contains a claim with no source and date.
  - title: The reviewer is never the writer
    attach_point: issue_submit_review
    natural_language: The actor who wrote the draft synthesis on an issue cannot be the actor who submits that issue for review; the evidence review is done by someone else.

doctrine: |
  - A research question is an item, and its first line names the decision it feeds. A question no decision needs is closed as out of scope, not researched.
  - No claim without a source: every number and every assertion carries its source, the publication date, and who published it. An unsourced sentence is deleted, not softened.
  - Primary beats secondary. A vendor's own page is never the only source for a claim about that vendor, and a press article is never the only source for a number.
  - Confidence is set explicitly on every answer, and lowered rather than flattered. "Low, because our only source is two years old" is more useful than "Medium" with no reason.
  - What we could not establish goes in the answer. An omitted uncertainty is a false claim; an admitted one is a finding.
  - A synthesis is checked by an actor who did not write it, then approved by a person before anyone quotes it outside the desk. "No source available" is a legitimate, closable result.

