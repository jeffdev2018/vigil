notes:
  - title: Research · Source log
    content: |
      # Source log

      One line per source we have actually opened. Add before you cite, not
      after. A source with no date does not get a line — it gets dropped.

      Format: `date | publisher | title | where | the claim we take from it`

      ## Kept
      - `2026-03-11 | national statistics office | Small business ICT survey 2026 | published PDF, table 4 | 38% of firms under 20 staff run no ticketing tool`

      ## Dead ends
      Record these too. A dead end found twice is a week wasted.
      - `vendor pricing page, undated` — no dated pricing anywhere public; the figures circulating in articles all trace back to one 2024 blog post.

      ## Rules
      - Primary source, or say it is secondary.
      - The publisher, not the aggregator that reprinted it.
      - If the source is behind a paywall or an account, note that: the next
        reader needs to know whether they can check it.
    tags: [research, sources]
    pinned: true

