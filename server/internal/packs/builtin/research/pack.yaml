      An example research question. Feeds the decision: whether the next pricing tier targets teams under 20 people.

      Needed: a dated, primary estimate of the number of such firms in our two launch countries, and any published figure on what they currently spend on comparable tools. Evidence base: Nothing yet. Confidence: Not assessed.
    status: todo
    priority: high
    project: Research desk
    goal_key: g-cited-answers
    labels: [market]
  - title: "Example · Does the competing product actually enforce its stated retention limit?"
    description: |
      An example research question in review. Feeds the decision: whether we claim a retention advantage in the next release note.

      A draft synthesis exists citing the competitor's documentation and two support threads. Waiting on the evidence reviewer: the documentation is vendor material, so the claim cannot rest on it alone.
