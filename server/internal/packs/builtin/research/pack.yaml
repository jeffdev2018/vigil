properties:
  - name: Confidence
    type: select
    description: How much weight the answer can carry. Set it explicitly and lower it rather than flatter it.
    icon: gauge
    config:
      options:
        - { name: High — primary sources agree, color: "#10b981" }
        - { name: Medium — one good source, color: "#f59e0b" }
        - { name: Low — indicative only, color: "#ef4444" }
        - { name: Not assessed, color: "#94a3b8" }
    issue_types: [question, synthesis]
  - name: Evidence base
    type: select
    description: What the answer actually rests on.
    icon: bookmark
    config:
      options:
        - { name: Primary sources, color: "#10b981" }
        - { name: Secondary reporting, color: "#f59e0b" }
        - { name: Vendor material only, color: "#ef4444" }
        - { name: Our own data, color: "#0ea5e9" }
        - { name: Nothing yet, color: "#94a3b8" }
    issue_types: [question, synthesis]

