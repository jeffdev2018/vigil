pack:
  id: research
  version: 1.0.0
  title: Research desk
  summary: Questions as work items, sources and evidence in the Brain, an explicit confidence, a researcher that drafts and a reviewer that checks provenance before a person approves.
  description: |
    Sets up a research desk that produces answers somebody can check: a
    **Research question** work item type, a **Synthesis** type for the write-up,
    a "Confidence" and an "Evidence base" property, the statuses a question
    waits in, saved views for the queue and the review, a researcher agent, a
    separate evidence-reviewer agent that checks primary sources, dates and
    provenance, an approval gate on the close, a pinned source log in the Brain,
    and a doctrine section that forbids the uncited claim.

    Works with no agent at all: the type, the confidence property and the source
    log give a human desk a citation discipline on day one. Connect the native
    runtime to let the researcher draft and the reviewer check.

    First week: take the three questions people keep asking in chat, open them
    as Research questions, name the decision each one feeds, and answer one end
    to end — draft, evidence review, approval. That answer is the template.
  domain: research
  wave: 2
  author: Multica
  license: MIT
  tags: [research, evidence, sources, synthesis]
  works_without_agents: true
  metric:
    label: Questions answered with a cited synthesis
    description: Share of closed research questions whose synthesis cites every claim to a source with a date and a publisher.
    hint: Type "question", view "Answered questions"; a close without a cited synthesis does not count.
  prerequisites:
    - kind: native_runtime
      name: Native runtime
      optional: true
      note: Lets the researcher and reviewer agents run in the browser without a CLI.
    - kind: integration
      name: Web search or a document store
      optional: true
      note: Without one, the desk works from sources people paste into the Brain.
  changelog:
    - version: 1.0.0
      note: First release.

