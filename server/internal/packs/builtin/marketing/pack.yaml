notes:
  - title: Marketing · Voice, claims and channel rules
    content: |
      # Voice, claims and channel rules

      The single source for how we sound and what we are allowed to say. If a
      claim is not here, it does not go into a draft.

      ## Voice
      Plain sentences. Concrete before abstract. A number instead of an
      adjective wherever a number exists. We never write "revolutionary",
      "game-changing" or "seamlessly". We do not open with a rhetorical
      question. We would rather be short than thorough.

      ## Claims we can make
      Write each one here with its source and the date it was checked:
      product capabilities that are shipped and in the docs, published
      benchmark numbers with the method, and customer results with the
      customer's written permission. Anything on a roadmap is not a claim.

      ## Claims we never make
      A delivery date engineering has not committed to. A named customer
      without their written permission on file. A competitor's pricing or
      shortcoming from anything other than their own public page, quoted with
      the date. A percentage improvement with no method behind it.

      ## Channel rules
      - Blog: 800 to 1500 words, one idea, an H2 every 300 words, one image.
      - Newsletter: under 400 words, one link, subject line under 45 characters.
      - LinkedIn: under 200 words, no link in the post body — put it in the first comment.
      - X: one claim per post, thread only when each post stands alone.
      - YouTube: script first, and the script is a content piece of its own.
      - Podcast: the show notes are part of the piece, not an afterthought.
      - Landing page: one action, above the fold, and the claim on it must exist in this note.
    tags: [marketing, voice, claims]
    pinned: true

