pack:
  id: marketing
  version: 1.0.0
  title: Marketing & content
  summary: Campaigns as projects, every content piece an issue with a channel and a publish date, a writer and a fact-checker as colleagues, and nothing external published without a person approving it.
  description: |
    Sets up a content operation for a small team: a **Content piece** work
    item for anything that gets published and a **Campaign task** for the work
    around it, the statuses a piece really moves through (drafting, in
    fact-check, scheduled), a **Channel** property so one calendar covers the
    blog, the newsletter and social, a funnel stage and a target publish date,
    saved views that behave as an editorial calendar, a writer agent that
    drafts and a fact-checker agent that checks every claim against the
    workspace's own note — and an approval on the last step, so nothing
    reaches the public because a schedule fired.

    Campaigns are projects: the pack ships one project for always-on content,
    and each campaign you run gets its own. Works with no agent at all.
    Connect the native runtime to let the writer and the fact-checker work.
  domain: marketing
  wave: 2
  author: Multica
  license: MIT
  tags: [marketing, content, editorial, campaigns, publishing]
  works_without_agents: true
  metric:
    label: Pieces published per week
    description: Number of content pieces that reached Done, counted per week and split by channel. A piece counts once, on the day it went live.
    hint: Type "content_piece", view "Published"; group by the Channel property and count per week. A piece that never left fact-check is not a published piece.
  prerequisites:
    - kind: native_runtime
      name: Native runtime
      optional: true
      note: Lets the writer and the fact-checker work without a CLI on anyone's machine.
    - kind: integration
      name: Analytics or a site CMS
      optional: true
      note: A published piece can carry its own numbers instead of a screenshot pasted once a month.
  changelog:
    - version: 1.0.0
      note: First release.

