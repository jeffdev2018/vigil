transition_rules:
  - from_category: in_review
    to_category: done
    allowed_roles: [owner, admin]
    allow_actor_types: [member]
    requires_approval: true
    approver_roles: [owner, admin]
    reject_status_key: drafting
    enabled: true
  - from_category: in_progress
    to_category: in_review
    allowed_roles: [owner, admin, member]
    allow_actor_types: [member, agent]
    requires_approval: false
    approver_roles: []
    enabled: true

business_rules:
  - title: Nothing external is published without a named human approval
    attach_point: issue_submit_review
    natural_language: An issue of type "content_piece" can only move out of In fact-check to Done when an owner or admin has approved it on the issue; an agent must never mark a piece as published, and an autopilot firing is not an approval.
  - title: A piece that needs legal does not leave fact-check on the fact-checker's word
    attach_point: issue_submit_review
    natural_language: A content piece labelled "needs-legal" cannot be approved unless a person from legal has left a comment on the issue saying which claims they cleared.

doctrine: |
  - Every campaign is a project. Its pieces are issues in that project, so "how did the launch go" is one view and not a hunt.
  - A piece gets its Channel, Funnel stage and Target publish date before the first sentence is written. No brief, no draft.
  - The writer drafts and the fact-checker checks. Neither of them publishes: a person approves every external piece, one at a time.
  - Every number, quote, customer name and competitor comparison is traced to the claims note or it comes out of the draft. "Probably right" is not a source.
  - A scheduled piece is frozen. Any edit sends it back to fact-check, even a headline, even an hour before it goes out.
  - One piece per channel. A version for another channel is its own issue with the repurpose label and a link to the original, so the calendar tells the truth about volume.
  - A target publish date that has passed is either moved with a reason on the issue or the piece is cancelled. Nothing sits in the calendar's past.

ownership_rules:
  - label: seo
    referent_agent: Marketing · Writer
    priority: 10
  - label: needs-legal
