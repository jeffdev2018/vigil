notes:
  - title: Support · Canned answers
    content: |
      # Canned answers

      One section per question the desk answers more than twice. Each entry:
      the question in the customer's words, the answer in ours, and what to
      check before reusing it. Replace an answer by moving the old text under
      "Replaced" with the date — nobody should wonder what we used to say.

      ## "Why was I charged twice this month?"
      Check first: the invoice list for the account, and whether a plan change
      happened mid-cycle.
      Answer: a mid-cycle plan change bills the remainder of the old plan and
      the start of the new one on the same day, so two lines appear. Send both
      invoice numbers and the dates they cover. If the two lines are the same
      amount for the same period, it is a genuine double charge — open a refund
      request instead of sending this answer.

      ## "Can you delete my account and all my data?"
      Check first: whether the account is on a paid plan with time left.
      Answer: confirm what will be deleted, what we must keep and for how long,
      and that deletion cannot be undone. Ask for a written confirmation from
      the account's owner before anything is deleted. Never delete on the
      strength of one email.

      ## Refund policy
      Inside policy: a failed charge, a double charge, or a paid feature that
      did not work for the period billed. Outside policy: a change of mind
      after the period has been used. Either way the amount and the reason go
      on the issue, and an owner or admin approves it.
    tags: [support, canned-answer]
    pinned: true

