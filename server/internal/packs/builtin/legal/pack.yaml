    name: Awaiting counterparty
    description: We answered and the other side has to move. Their clock, not ours — this time is excluded from turnaround.
    category: blocked
    color: "#f59e0b"
  - key: awaiting_business_owner
    name: Awaiting business owner
    description: A commercial question has to be settled inside the company before the legal review can continue.
    category: blocked
    color: "#8b5cf6"

