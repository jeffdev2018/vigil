notes:
  - title: Legal · Clause library
    content: |
      # Clause library

      Our position on each clause, and what we have accepted before. The
      contract reader compares drafts against this note, so a position that is
      not written here does not exist.

      Each entry: **our position**, **acceptable variants** (with the
      counterparty and date we accepted them), **never**.

      ## Liability cap
      - **Our position**: mutual cap at the fees paid in the 12 months before
        the claim.
      - **Acceptable**: 2x annual fees for a customer contract over a year old.
      - **Never**: uncapped liability, or a cap that binds only us.

      ## Indemnities
      - **Our position**: we indemnify for IP infringement by our own product,
        capped as above.
      - **Never**: indemnifying the counterparty's use of the product, or any
        indemnity described as "uncapped" or "notwithstanding the cap".

      ## Term and termination
      - **Our position**: 12-month term, 30 days' notice before renewal,
        termination for convenience with 30 days' notice.
      - **Never**: auto-renewal with more than 60 days' notice, or no exit for
        convenience on a multi-year term.

      ## Payment terms
      - **Our position**: 30 days net. **Acceptable**: 45 days for a public
        body. **Never**: payment conditional on the counterparty's own
        collection from a third party.

      ## Data protection
      - **Our position**: our DPA, our sub-processor list, 72-hour breach
        notice, audit by written questionnaire.
      - **Never**: an on-site audit right without notice, or an obligation to
        add a sub-processor we have not assessed.

      ## IP and licence grants
      - **Our position**: the customer gets a licence for the term, nothing
        more. **Never**: any assignment of our IP, or a licence surviving
        termination.

      ## Governing law
      - **Our position**: our own jurisdiction.
      - **Acceptable**: a neutral third jurisdiction for a counterparty larger
        than us. **Never**: a jurisdiction where we could not realistically
        litigate.

      ## Recording a new precedent
      When we accept something not listed here, add it the same week: the
      counterparty, the date, the wording accepted, and the reason. That line
      is what stops us re-negotiating the same point from zero next year.
    tags: [legal, clauses]
    pinned: true

