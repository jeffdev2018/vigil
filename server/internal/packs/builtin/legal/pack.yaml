pack:
  id: legal
  version: 1.0.0
  title: Legal & contracts
  summary: Contract reviews and legal requests with a counterparty and a risk level, a clause library in the Brain, a person approving every review, and a contract reader that flags deviations and never advises.
  description: |
    Sets up the legal work of a company that has no legal department: a
    **Contract review** and a **Legal request** type, a "Counterparty", a "Risk
    level" and a "Signature owner" property, the two statuses a review actually
    waits in, saved views for the queue and for what is waiting on someone
    else, an approval gate no agent can pass, a contract-reader agent that
    compares an incoming draft against our clause library and quotes the
    deviations, a pinned clause library in the Brain, and a doctrine section
    that forbids legal advice leaving the workspace.

    Works with no agent at all: the types, the risk level and the clause library
    turn scattered contract threads into a queue with a turnaround you can
    measure. Connect the native runtime to let the reader compare drafts.

    First week: open a Contract review for every contract currently in a mail
    thread, set the counterparty and the risk level, and write the three clauses
    you always negotiate into the clause library. The reader is only as good as
    that note.
  domain: legal
  wave: 3
  author: Multica
  license: MIT
  tags: [legal, contracts, review, risk]
  works_without_agents: true
  metric:
    label: Review turnaround
    description: Working days between a contract review being opened and a person approving its close, excluding the time it sits waiting on the counterparty.
    hint: Type "contract_review", view "Open reviews"; subtract time spent on "Awaiting counterparty".
  prerequisites:
    - kind: native_runtime
      name: Native runtime
      optional: true
      note: Lets the contract reader agent run in the browser without a CLI.
    - kind: integration
      name: Document store
      optional: true
      note: Without one, drafts are attached to the item or pasted into it.
  changelog:
    - version: 1.0.0
      note: First release.

issue_statuses:
