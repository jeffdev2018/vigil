    description: Mutual and one-way non-disclosure agreements.
    color: "#94a3b8"
    resource_type: issue
  - name: dpa
    description: Data processing agreements, sub-processors, transfer terms.
    color: "#ef4444"
    resource_type: issue
  - name: customer-contract
    description: Terms we sign with a customer, and their purchase-order paperwork.
    color: "#10b981"
    resource_type: issue
  - name: supplier-contract
    description: Terms a supplier or contractor asks us to sign.
    color: "#0ea5e9"
    resource_type: issue
  - name: employment
    description: Employment and contractor agreements, IP assignment, non-compete.
    color: "#f59e0b"
    resource_type: issue

properties:
  - name: Counterparty
    type: text
    description: Who is on the other side, as named in the document. Written before the review starts.
    icon: briefcase-business
    config: {}
    issue_types: [contract_review, legal_request]
  - name: Risk level
    type: select
    description: What we are exposed to if this goes wrong. Set from the clauses, not from the size of the deal.
    icon: circle-alert
    config:
      options:
        - { name: "Low — standard terms", color: "#10b981" }
        - { name: Medium — accepted deviations, color: "#f59e0b" }
        - { name: High — unusual exposure, color: "#ef4444" }
        - { name: Blocker — not signable, color: "#7f1d1d" }
        - { name: Not assessed, color: "#94a3b8" }
    issue_types: [contract_review, legal_request]
  - name: Signature owner
    type: actor
    description: The person who signs, or who owns the answer. High and Blocker never rest on the reviewer's own authority.
    icon: user-round
    config: {}
    issue_types: [contract_review, legal_request]

views:
  - name: Open reviews
    scope_type: workspace
    visibility: workspace
    query:
      typeFilters: [contract_review, legal_request]
      statusFilters: [todo, in_progress, in_review, awaiting_counterparty, awaiting_business_owner]
    display: {}
  - name: Waiting on someone else
    scope_type: workspace
    visibility: workspace
    query:
      typeFilters: [contract_review, legal_request]
      statusFilters: [awaiting_counterparty, awaiting_business_owner]
    display: {}
  - name: Awaiting sign-off
    scope_type: workspace
    visibility: workspace
    query:
      typeFilters: [contract_review]
      statusFilters: [in_review]
    display: {}

transition_rules:
  - from_category: in_progress
    to_category: in_review
    allowed_roles: [owner, admin, member]
    allow_actor_types: [member, agent]
    requires_approval: false
    approver_roles: []
    enabled: true
  - from_category: in_review
    to_category: done
    allowed_roles: [owner, admin]
    allow_actor_types: [member]
    requires_approval: true
    approver_roles: [owner, admin]
    reject_status_key: awaiting_business_owner
    enabled: true

business_rules:
  - title: A review is closed by a person, never by an agent
    attach_point: issue_submit_review
    natural_language: An issue of type "contract_review" cannot be moved to done by an agent, and cannot be closed while its "Risk level" is "Not assessed" or "Blocker".
  - title: No agent run on a data or employment contract without a signature owner
    attach_point: agent_run_dispatch
    natural_language: An agent run must not be dispatched on an issue labelled "dpa" or "employment" whose "Signature owner" property is empty.

doctrine: |
  - Every contract, amendment and legal question is an item, with the Counterparty and a Risk level set before the reading starts. "Not assessed" is a starting state, not a resting one.
  - The contract reader compares a draft against our clause library, quotes the clause it is flagging, and says how it deviates. It never gives legal advice, never answers the counterparty, and never writes to anyone outside the workspace.
  - A review closes only when the person named in "Signature owner" has approved it in the item, whatever the reader found and however small the contract looks.
  - High and Blocker are never signed on the reviewer's own authority: they go to the signature owner with the exposure written in one sentence, and Blocker means we ask for a change rather than accept a caveat.
  - Anything we accept that departs from the clause library is written back into the library the same week, with the counterparty, the wording accepted and why. A precedent nobody recorded gets re-negotiated from scratch next time.
  - The counterparty's deadline is theirs. A review with no answer after five working days is escalated to the signature owner, not waited on quietly.

