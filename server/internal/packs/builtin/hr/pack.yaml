    category: blocked
    color: "#f59e0b"
  - key: withdrawn
    name: Withdrawn
    description: The candidate withdrew or the request was taken back. Kept, not deleted, so the pipeline numbers stay honest.
    category: cancelled
    color: "#94a3b8"

