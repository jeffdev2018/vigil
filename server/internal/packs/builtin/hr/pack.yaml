transition_rules:
  - from_category: in_review
    to_category: done
    allowed_roles: [owner, admin, member]
    allow_actor_types: [member]
    requires_approval: true
    approver_roles: [owner, admin]
    reject_status_key: awaiting_employee
    enabled: true
  - from_category: in_progress
    to_category: in_review
    allowed_roles: [owner, admin, member]
    allow_actor_types: [member]
    requires_approval: false
    approver_roles: []
    enabled: true

business_rules:
  - title: A candidate is never advanced or closed by an agent
    attach_point: issue_submit_review
    natural_language: An issue of type "candidate" cannot be submitted for review by an agent; only a member moves a candidate forward, and only after writing what happened in the step they ran.
  - title: No agent run on a candidate or a policy item
    attach_point: agent_run_dispatch
    natural_language: An agent run must not be dispatched on an issue of type "candidate", nor on any issue labelled "policy" or "contract".

doctrine: |
  - A candidate or employee item carries the minimum needed to run the next step: a first name and a last initial, the stage, the manager, the role. Nothing else.
  - Never in a title, description, comment or property: salary or pay figures, health information, identity or bank details, home address, family situation, or an evaluation of someone's character. Those live in the HR system of record; the item links to it, it does not copy it.
  - Agents work on onboarding steps and on requests. They are never assigned a candidate item, never dispatched on anything labelled policy or contract, and never read a document attached to a person's item.
  - The hiring stage moves only after the person who ran the step has written what happened. A stage is never advanced by a calendar, a reminder or an agent.
  - A leave, equipment or contract request is approved in the item by the manager named in "Approving manager", so the decision has a trace and the employee can see it.
  - Offboarding removes every access on the last working day and the checklist proves it, step by step, with the person who did each one.

