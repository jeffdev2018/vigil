notes:
  - title: People · Confidentiality — what may be written where
    content: |
      # What may be written where

      The workspace is readable by colleagues and, on some items, by agents.
      Treat every field as readable by more people than you have in mind.

      ## Never in an item — title, description, comment or property
      - Pay, bonus, equity or any figure attached to a person
      - Health information, diagnoses, certificates, accommodations detail
      - Identity documents, national numbers, bank details
      - Home address, family situation, personal contact details
      - A judgement of someone's character or personality

      ## Instead
      | Instead of | Write |
      | --- | --- |
      | the salary offered | "offer terms recorded in the HR system" |
      | what the sick note says | "medical certificate received, dates covered" |
      | the ID number | "identity verified on <date> by <name>" |
      | "not a culture fit" | the observable fact from the step, or nothing |

      ## Where the real record lives
      The HR system of record holds contracts, pay, identity and health data.
      An item links to it. It never copies it. If the link cannot be shared,
      the item says who to ask.

      ## Agents
      Agents may work on onboarding steps and people requests. They are never
      assigned a candidate item, never dispatched on policy or contract items,
      and never read an attached document. This is a doctrine rule and two
      business rules, not a preference.
    tags: [hr, confidentiality]
    pinned: true

