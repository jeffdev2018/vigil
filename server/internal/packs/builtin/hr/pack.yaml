    scope_type: workspace
    visibility: workspace
    query:
      typeFilters: [candidate]
      statusFilters: [todo, in_progress, in_review, awaiting_employee]
    display: {}
  - name: Open people requests
    scope_type: workspace
    visibility: workspace
    query:
      typeFilters: [request]
      statusFilters: [todo, in_progress, in_review, awaiting_employee]
    display: {}
  - name: Onboarding steps due
    scope_type: workspace
