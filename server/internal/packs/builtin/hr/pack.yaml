pack:
  id: hr
  version: 1.0.0
  title: People & HR
  summary: A hiring pipeline whose stage is a property, onboarding as a project of dated steps, leave and contract requests as tickets, and a confidentiality rule agents cannot read around.
  description: |
    Sets up the people side of a small company: a **Candidate** type whose
    pipeline stage is a property (so the board is one view, not seven
    statuses), a **People request** type for leave, equipment and contract
    changes, an **Onboarding step** type, an onboarding project whose steps
    carry owners and due dates, labels for the areas HR actually works in,
    saved views for the pipeline and the request queue, an onboarding
    coordinator agent, and a doctrine section that keeps personal data out of
    every field an agent can read.

    Works with no agent at all: the pipeline property, the request type and the
    onboarding project run a human HR desk from day one. Connect the native
    runtime to let the coordinator chase the steps.

    First week: copy the onboarding project for the next arrival, put a due date
    on every step relative to their first day, and move your current candidates
    into the pipeline view. Read the confidentiality note before entering a
    single name.
  domain: hr
  wave: 3
  author: Multica
  license: MIT
  tags: [hr, hiring, onboarding, leave]
  works_without_agents: true
  metric:
    label: Onboarding steps completed before day one
    description: Share of an arrival's onboarding steps closed before their first working day — the ones that make the first day usable rather than administrative.
    hint: Project "Onboarding", type "onboarding_step"; compare each step's closed date with the arrival's start date.
  prerequisites:
    - kind: native_runtime
      name: Native runtime
      optional: true
      note: Lets the onboarding coordinator agent run in the browser without a CLI.
    - kind: channel
      name: Slack or Telegram
      optional: true
      note: Colleagues can file leave and equipment requests from chat.
  changelog:
    - version: 1.0.0
      note: First release.

