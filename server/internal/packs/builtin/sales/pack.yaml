properties:
  - name: Deal stage
    type: select
    description: Where the deal stands. This is the field the pipeline is read from — statuses say whether work is happening, the stage says how far along the sale is.
    icon: milestone
    config:
      options:
        - { name: Discovery, color: "#94a3b8" }
        - { name: "Demo booked", color: "#0ea5e9" }
        - { name: "Proposal sent", color: "#8b5cf6" }
        - { name: Negotiation, color: "#f59e0b" }
        - { name: "Verbal yes", color: "#10b981" }
    issue_types: [deal, renewal]
  - name: Deal size
    type: select
    description: Annual value, in bands. Bands rather than a number, so nobody argues about a figure that is still a guess.
    icon: hash
    config:
      options:
        - { name: "Under 5k", color: "#94a3b8" }
        - { name: "5k to 25k", color: "#0ea5e9" }
        - { name: "25k to 100k", color: "#f59e0b" }
        - { name: "Over 100k", color: "#ef4444" }
    issue_types: [deal, renewal]
  - name: Account
    type: text
    description: The company's name, spelled the same way every time. One account can have several deals and renewals.
    icon: briefcase-business
    config: {}
    issue_types: [lead, deal, renewal]

views:
  - name: Leads to qualify
    scope_type: workspace
    visibility: workspace
    query:
      typeFilters: [lead]
      statusFilters: [todo, qualifying]
    display: {}
  - name: Deals in play
    scope_type: workspace
    visibility: workspace
    query:
      typeFilters: [deal, renewal]
      statusFilters: [qualifying, in_progress, awaiting_customer, in_review]
    display: {}
  - name: Discounts to approve
    scope_type: workspace
    visibility: workspace
    query:
      typeFilters: [deal, renewal]
      statusFilters: [in_review]
      labelFilters: [discount-requested]
    display: {}

transition_rules:
  - from_category: in_review
    to_category: done
    allowed_roles: [owner, admin]
    allow_actor_types: [member]
    requires_approval: true
    approver_roles: [owner, admin]
    reject_status_key: qualifying
    enabled: true
  - from_category: in_progress
    to_category: in_review
    allowed_roles: [owner, admin, member]
    allow_actor_types: [member, agent]
    requires_approval: false
    approver_roles: []
    enabled: true

business_rules:
  - title: No discount is offered before it is approved
    attach_point: issue_submit_review
    natural_language: A deal or renewal labelled "discount-requested" cannot be marked Won and no proposal containing a price below list may be treated as sent until an owner or admin has approved the discount on the issue, with the percentage and the reason written down.
  - title: An agent never contacts a prospect
    attach_point: agent_run_dispatch
    natural_language: An agent working on a lead, deal or renewal may only write comments and drafts inside the workspace; it must not send an email, book a meeting or message anyone outside the team.

doctrine: |
  - A lead has one owner and one next step with a date, from the hour it arrives. A lead with no next step is either qualified or dropped on purpose.
  - Qualifying means four answers written on the issue: what problem, what budget, who signs, by when. Anything with no decision-maker keeps the no-decision-maker label until one is in a conversation.
  - The Deal stage property is the pipeline. Move it only after something happened with the prospect, never to make a board look better.
  - Nothing leaves the workspace from an agent. Agents research and draft; a person sends every email and joins every call.
  - Any price below list is a discount: it gets the discount-requested label, an owner's approval on the issue with the percentage and the reason, and only then goes into a proposal.
  - Awaiting customer requires a chase date on the issue. Three chases with no answer and the deal is closed as cancelled with the reason, not left to rot.
  - A deal is Won when it is signed, and the signed number and start date are on the issue. A verbal yes is a stage, not a result.

ownership_rules:
  - label: inbound
    referent_agent: Sales · Account researcher
    priority: 10
  - label: discount-requested
    referent_agent: Sales · Proposal drafter
    priority: 20

skills:
  - name: sales-procedure
    description: How a lead is qualified, a deal is moved, a proposal is drafted and a discount is approved.
    content: |
      # Sales procedure

      ## A new lead
      1. Set Account and the source label — inbound, outbound or referral. Referrals go first, always.
      2. Write what we know and, separately, what we are guessing. Never mix the two in the description.
      3. Propose the next step with a date as a comment. Do not book anything yourself.
      4. Set the status to Qualifying only once someone from the team has a call scheduled.

      ## Qualifying
      5. Four answers go on the issue, each in the prospect's own words where possible: what problem they are trying to solve, what budget exists, who signs, by when.
      6. If nobody who can sign has been in a conversation, keep the no-decision-maker label. Do not move the Deal stage past Demo booked.
      7. If the answer to "what problem" is not one we solve, disqualify it deliberately: comment why and cancel the issue. A clean no beats a lead that lingers.
      8. Once the four answers are there, convert to a Deal: set Deal stage, Deal size and Account.

      ## Moving a deal
      9. Change Deal stage only after something happened with the prospect, and say in a comment what it was.
      10. Every deal has a next step with a date. If the ball is with the prospect, set Awaiting customer and write the chase date.
      11. Add competitor-in-play the moment another vendor is named, and note what they are being compared on.

      ## Drafting a proposal
      12. Read the Brain note "Sales · Pricing, objections and guardrails" before writing anything about price.
      13. Draft the proposal as a comment starting with "Draft proposal:". Never send it, never attach it to an email, never share a link outside the workspace.
      14. Quote list price. If the deal needs less, do not write the discounted figure into the draft: add the discount-requested label, state the percentage and the reason, set the status to In review and stop.
      15. Once an owner or admin has approved the discount on the issue, add the approved figure to the draft and hand it to the deal's owner to send.

      ## Closing
      16. Won means signed. Put the signed number and the start date on the issue, then submit for review; an approver marks it Won.
      17. Lost means cancelled, with the reason and the competitor if there was one. A lost deal with no reason teaches nobody anything.
    status: published
    config: {}
    files: []

agents:
  - name: Sales · Proposal drafter
    description: Drafts proposals and follow-up messages at list price, flags every discount for approval, sends nothing.
    instructions: |
      You draft the written side of a sale. Given a deal, you read the four qualifying answers and the Brain note "Sales · Pricing, objections and guardrails", then write the proposal as a comment starting with "Draft proposal:" — the problem in the prospect's words, what we do about it, what it costs at list price, and what happens next with dates. You never send anything, never email, never book a meeting, never share a link outside the workspace. You never write a price below list into a draft: instead you add the discount-requested label, state the percentage asked for and the reason, set the status to In review and stop until an owner or admin approves it on the issue. You never invent a capability, a customer reference or a date — if a claim is not in the Brain, ask for it in a comment. Follow the sales-procedure skill.
    model: ""
    thinking_level: ""
    service_tier: ""
    runtime_mode: native
    visibility: workspace
    max_concurrent_tasks: 2
    runtime_config: {}
    mcp_config: {}
    custom_args: []
    conversation_starters: []
    env_keys: []
    scoped_env_keys: []
    trust_mode: propose
    effect_mode: preview
    permission_profile: ""
    skills: [sales-procedure]
    versions: []
  - name: Sales · Account researcher
    description: Prepares a lead before the first call and keeps the pipeline's facts straight.
    instructions: |
      You prepare leads so a human's first call is not spent asking what could have been read. For each lead you set Account with the company's name spelled the way it will be spelled every time, write what we know and, in a separate paragraph, what we are guessing, and propose the next step with a date. You mark what you could not find rather than filling the gap with a plausible sentence: an invented headcount, funding round or job title is worse than a blank. You never contact anyone outside the team, never book a meeting, never move a Deal stage — you propose the move in a comment and a person makes it. When a deal has no decision-maker in any conversation, you say so plainly and keep the no-decision-maker label. Follow the sales-procedure skill.
