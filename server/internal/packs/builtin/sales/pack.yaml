pack:
  id: sales
  version: 1.0.0
  title: Sales pipeline
  summary: Leads and deals with a stage on every one, a follow-up cadence nothing falls out of, a proposal drafter, and an approval before any discount or a deal being called won.
  description: |
    Sets up a pipeline a small team can actually run: a **Lead** work item
    for anything unqualified, a **Deal** for anything with a stage and a
    number, a **Renewal** for the money you already have, the statuses a deal
    sits in between the stages (qualifying, awaiting customer, won), a **Deal
    stage** property so the stage is a field and not a column you have to
    migrate, **Deal size** and **Account** properties, saved views for the
    leads to qualify and the deals in play, an autopilot that keeps the
    follow-up cadence honest, an agent that drafts proposals and an agent
    that researches accounts — neither of which contacts a prospect.

    Works with no agent at all: the stage property, the views and the cadence
    doctrine make a two-person sales team usable on day one. Connect the
    native runtime to let the drafter and the researcher work.
  domain: sales
  wave: 2
  author: Multica
  license: MIT
  tags: [sales, pipeline, deals, leads, proposals]
  works_without_agents: true
  metric:
    label: Lead to first qualified call
    description: Median time between a lead arriving and the first call that ended with the lead qualified or disqualified on purpose. The second number to watch is deals moved to a further stage per week.
    hint: Type "lead", view "Leads to qualify"; compare each lead's created time with the comment recording the qualifying call. For movement, count Deal stage changes per week in the view "Deals in play".
  prerequisites:
    - kind: native_runtime
      name: Native runtime
      optional: true
      note: Lets the proposal drafter and the account researcher work without a CLI on anyone's machine.
    - kind: channel
      name: Shared sales inbox
      optional: true
      note: Inbound leads arrive as issues instead of living in one person's mailbox.
  changelog:
    - version: 1.0.0
      note: First release.

