notes:
  - title: Sales · Pricing, objections and guardrails
    content: |
      # Pricing, objections and guardrails

      The only place a price or a claim may come from. If it is not written
      here, it is not something we say to a prospect.

      ## List price
      Write the current list price per plan and per seat, with the date it was
      last changed. Anything below these figures is a discount and needs an
      owner's or admin's approval on the issue.

      ## What a discount costs to ask for
      Say the percentage and the reason on the issue: multi-year commitment,
      reference customer, a genuine competitive floor. "They asked" is not a
      reason. Discounts are never offered before they are asked for.

      ## Objections we get, and the honest answer
      - "It is more expensive than the alternative." Compare on what they told
        us their problem is, not on feature counts. If we are genuinely worse
        for their case, say so and stop selling.
      - "We already have something for this." Ask what it does not do. If the
        answer is nothing, disqualify the deal.
      - "Send me a proposal." Only after the four qualifying answers exist.
        A proposal into an unqualified deal is a week thrown away.

      ## Never say
      A delivery date engineering has not committed to. A customer's name as a
      reference without their written permission. A capability that is on a
      roadmap rather than in the product.
    tags: [sales, pricing]
    pinned: true

